name: Build and push to Azure
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: littlemindsacr2026.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            littlemindsacr2026.azurecr.io/little-minds-ai:v${{ github.run_number }}
            littlemindsacr2026.azurecr.io/little-minds-ai:latest
